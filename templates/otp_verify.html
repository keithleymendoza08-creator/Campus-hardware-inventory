{% extends 'base.html' %}
{% block title %}Verify OTP - Global Payments HRIS{% endblock %}
{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-4">
        <div class="card card-custom p-4 text-center">
            <i class="bi bi-shield-lock text-success display-4 mb-2"></i>
            <h4 class="fw-bold text-gp">Enter OTP Code</h4>
            <p class="text-muted small">We sent a 6-digit code to your email. The code is valid for 5 minutes.</p>
            <form action="{{ action_url }}" method="POST">
                <div class="mb-3">
                    <input type="text" name="otp_code" maxlength="6" class="form-control text-center fs-3 fw-bold tracking-widest" required placeholder="000000">
                </div>
                <button type="submit" class="btn btn-gp w-100 fw-bold mb-3">Verify Code</button>
            </form>
            <a href="/resend-otp/{{ action }}" class="text-decoration-none small text-gp">Resend OTP Code</a>
        </div>
    </div>
</div>
{% endblock %}
