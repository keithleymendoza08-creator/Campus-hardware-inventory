{% extends 'base.html' %}
{% block content %}
<div class="col-md-5 mx-auto">
<div class="card p-4 mt-4 shadow border-0">
  <h5 class="text-nu fw-bold text-center" style="color:#35408E;">Create NU Account 🎓</h5>
  <form method="POST">
    <input name="student_id" class="form-control mb-2" placeholder="Student ID / Employee ID (e.g. 2023-12345)" required>
    <input name="fullname" class="form-control mb-2" placeholder="Fullname" required>
    <input name="email" type="email" class="form-control mb-2" placeholder="NU Email" required>

    <label class="small fw-bold">Select Role:</label>
    <select name="role" id="roleSelect" class="form-select mb-2" required onchange="toggleDept()">
      <option value="">-- Select Role --</option>
      <option value="student">USER: STUDENT</option>
      <option value="employee">USER: EMPLOYEE</option>
      <option value="faculty_member">ADMIN: FACULTY MEMBER</option>
      <option value="laboratory_technician">ADMIN: LABORATORY TECHNICIAN</option>
    </select>

    <!-- DEPARTMENT & SECTION - LALABAS LANG PAG STUDENT AT EMPLOYEE -->
    <div id="deptFields" style="display:none;">
      <label class="small fw-bold">Department / Program:</label>
      <select name="department" id="deptSelect" class="form-select mb-2">
        <option value="">Select Department</option>
        <option value="Civil Engineering">Civil Engineering</option>
        <option value="Computer Engineering">Computer Engineering</option>
        <option value="ECE - Electronics and Communications Engineering">ECE - Electronics and Communications Engineering</option>
        <option value="EE - Electrical Engineering">EE - Electrical Engineering</option>
        <option value="Industrial Engineering">Industrial Engineering</option>
        <option value="Environmental Engineering">Environmental Engineering</option>
      </select>

      <label class="small fw-bold">Section:</label>
      <select name="section" id="sectionSelect" class="form-select mb-2">
        <option value="">Select Section</option>
        <option value="1A">1A</option>
        <option value="1B">1B</option>
        <option value="2A">2A</option>
        <option value="2B">2B</option>
        <option value="3A">3A</option>
        <option value="3B">3B</option>
        <option value="4A">4A</option>
        <option value="4B">4B</option>
        <option value="Employee">Employee</option>
      </select>
      <!-- course = same as department para di magulo DB -->
      <input type="hidden" name="course" id="courseHidden" value="">
    </div>

    <label class="small fw-bold">Password (Standard: min 8 chars):</label>
    <div class="input-group mb-3">
      <input id="regPass" name="password" type="password" class="form-control" placeholder="Password (min 8 chars - standard)" required minlength="8">
      <button type="button" class="btn btn-outline-secondary" onclick="togglePass()">👁️</button>
    </div>

    <button class="btn btn-nu w-100 text-white fw-bold" style="background:#35408E;">REGISTER</button>
  </form>
  <p class="mt-3 small text-center">Already have account? <a href="/login">Login here</a></p>
</div>
</div>

<script>
function toggleDept(){
  const role = document.getElementById('roleSelect').value;
  const deptDiv = document.getElementById('deptFields');
  const deptSelect = document.getElementById('deptSelect');
  const secSelect = document.getElementById('sectionSelect');
  
  if(role === 'student' || role === 'employee'){
    deptDiv.style.display = 'block';
    deptSelect.required = true;
    secSelect.required = true;
  } else {
    deptDiv.style.display = 'none';
    deptSelect.required = false;
    secSelect.required = false;
  }
  document.getElementById('courseHidden').value = deptSelect.value;
}

function togglePass(){
  const p = document.getElementById('regPass');
  p.type = p.type === 'password' ? 'text' : 'password';
}

document.getElementById('deptSelect').addEventListener('change', function(){
  document.getElementById('courseHidden').value = this.value;
});
</script>
{% endblock %}
