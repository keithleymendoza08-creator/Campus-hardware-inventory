<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - Laboratory System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex align-items-center justify-content-center min-vh-100">
    <div class="card p-4 shadow-sm" style="max-width: 400px; width: 100%; border-radius: 12px;">
        <h3 class="fw-bold mb-1">Reset Password 🔑</h3>
        <p class="text-muted small mb-3">Standard: min 8 characters</p>

        {% with messages = get_flashed_messages(with_categories=true) %}
          {% if messages %}
            {% for category, message in messages %}
              <div class="alert alert-{{ category }} py-2 text-center small mb-3">{{ message }}</div>
            {% endfor %}
          {% endif %}
        {% endwith %}

        <form action="{{ url_for('set_new_password') }}" method="POST">
            <div class="mb-3">
                <label for="new_password" class="form-label fw-semibold">New Password (min 8 chars - standard)</label>
                <input type="password" name="new_password" id="new_password" class="form-control" placeholder="New password (min 8)" required minlength="8">
            </div>

            <div class="mb-3">
                <label for="confirm_password" class="form-label fw-semibold">Confirm New Password</label>
                <input type="password" name="confirm_password" id="confirm_password" class="form-control" placeholder="Confirm new password (min 8)" required minlength="8">
            </div>

            <button type="submit" class="btn btn-warning w-100 fw-bold py-2 text-white" style="background-color: #d97706; border: none;">
                Update Password
            </button>
        </form>

        <div class="mt-3 text-center small">
            <a href="{{ url_for('login') }}" class="text-decoration-none">Back to Login</a>
        </div>
    </div>
</body>
</html>
