{% extends 'base.html' %}
{% block content %}
<div class="col-md-4 mx-auto">
<div class="card p-4 mt-5 shadow border-0">
<h5 class="fw-bold" style="color:#35408E;">Reset Password 🔑</h5>
<p class="small text-muted">Standard: min 8 characters</p>
<form method="POST" action="/reset_password">

<label class="small fw-bold">Current Password</label>
<div class="input-group mb-2">
<input id="current" name="current_password" type="password" class="form-control" placeholder="Current password" required>
<button type="button" class="btn btn-outline-secondary" onclick="toggle('current')">👁️</button>
</div>

<label class="small fw-bold">New Password (min 8 chars - standard)</label>
<div class="input-group mb-2">
<input id="new" name="new_password" type="password" class="form-control" placeholder="New password (min 8)" required minlength="8">
<button type="button" class="btn btn-outline-secondary" onclick="toggle('new')">👁️</button>
</div>

<label class="small fw-bold">Confirm New Password</label>
<div class="input-group mb-3">
<input id="confirm" name="confirm_password" type="password" class="form-control" placeholder="Confirm new password (min 8)" required minlength="8">
<button type="button" class="btn btn-outline-secondary" onclick="toggle('confirm')">👁️</button>
</div>

<button class="btn w-100 text-white fw-bold" style="background:#35408E;">Update Password</button>
</form>
<p class="small text-center mt-3"><a href="/profile">Back to Profile</a> | <a href="/dashboard">Dashboard</a></p>
</div>
</div>
<script>
function toggle(id){
  const el = document.getElementById(id);
  el.type = el.type === 'password' ? 'text' : 'password';
}
</script>
{% endblock %}
